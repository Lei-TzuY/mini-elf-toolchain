name: Format Patch

on:
  push:
    branches:
      - feat/sysv-hash-resolve

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          cargo fmt
          git diff -- src/bin/mini-elf-sysv-hash-resolve.rs tests/sysv_hash_resolve.rs > rustfmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
