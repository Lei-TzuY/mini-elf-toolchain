name: Temporary diagnose abs64
on:
  push:
    branches: [feat/dynrela-abs64]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynrela-abs64
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test dynamic_rela_abs64 -- --nocapture > abs64-test-output.txt 2>&1 || true
      - run: rm .github/workflows/tmp-diagnose-abs64.yml
      - run: |
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add abs64-test-output.txt .github/workflows/tmp-diagnose-abs64.yml
          git commit -m 'chore: capture focused abs64 test diagnostics'
          git push origin HEAD:feat/dynrela-abs64
