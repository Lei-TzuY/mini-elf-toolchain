name: Conquest Fix LSDA Test

on:
  push:
    branches:
      - conquest/eh-frame-lsda
    paths:
      - .github/workflows/conquest-fix-lsda-test.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/eh-frame-lsda
      - name: Correct unmapped-target regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/dynamic_eh_frame_lsda.rs')
          text = path.read_text()
          helper = '''fn map_offset_to_vaddr(file: &[u8], offset: usize) -> u64 {\n    for (_, kind, file_offset, vaddr, filesz) in program_headers(file) {\n        if kind == PT_LOAD\n            && offset as u64 >= file_offset\n            && (offset as u64) < file_offset + filesz\n        {\n            return vaddr + offset as u64 - file_offset;\n        }\n    }\n    panic!("offset {offset:#x} is not file-backed");\n}\n\n'''
          if helper not in text:
              raise SystemExit('expected map_offset_to_vaddr helper not found')
          text = text.replace(helper, '')
          old = '''    let field_vaddr = map_offset_to_vaddr(&file, payload);\n    let displacement = i32::try_from(field_vaddr)\n        .ok()\n        .and_then(|value| value.checked_neg())\n        .expect("fixture address fits signed 32-bit displacement");\n    file[payload..payload + 4].copy_from_slice(&displacement.to_le_bytes());\n'''
          new = '''    file[payload..payload + 4].copy_from_slice(&i32::MAX.to_le_bytes());\n'''
          if old not in text:
              raise SystemExit('expected LSDA displacement block not found')
          text = text.replace(old, new)
          old_assert = '''    assert!(String::from_utf8_lossy(&output.stderr)\n        .contains("LSDA target 0x0 is not file-backed PT_LOAD data"));\n'''
          new_assert = '''    assert!(String::from_utf8_lossy(&output.stderr)\n        .contains("is not file-backed PT_LOAD data"));\n'''
          if old_assert not in text:
              raise SystemExit('expected LSDA assertion not found')
          text = text.replace(old_assert, new_assert)
          path.write_text(text)
          PY
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add tests/dynamic_eh_frame_lsda.rs
          git commit -m "test: target unmapped LSDA address"
          git push origin HEAD:conquest/eh-frame-lsda
