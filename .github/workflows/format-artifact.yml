name: Format Artifact

on:
  push:
    branches:
      - feat/needed-runpath-resolve

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-runpath-slice
          path: |
            src/bin/mini-elf-needed-runpath-resolve.rs
            tests/dynamic_needed_runpath_resolve.rs
