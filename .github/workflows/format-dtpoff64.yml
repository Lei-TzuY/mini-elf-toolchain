name: Format DTPOFF64 slice
on:
  push:
    branches: [feat/dynrela-dtpoff64]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynrela-dtpoff64
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "Lei-TzuY"
            git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
            git add src/bin/mini-elf-dynrela-dtpoff64.rs tests/dynamic_rela_dtpoff64.rs
            git commit -m "style: apply canonical rustfmt"
            git push origin HEAD:feat/dynrela-dtpoff64
          fi
