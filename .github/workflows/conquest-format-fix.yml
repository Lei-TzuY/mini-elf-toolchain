name: Conquest Format Fix

on:
  push:
    branches:
      - conquest/bil-125-linker-script-comments

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/bil-125-linker-script-comments
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -u
          git commit -m "Apply stable rustfmt"
          git push origin HEAD:conquest/bil-125-linker-script-comments
