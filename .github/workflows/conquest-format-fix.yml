name: conquest-format-fix

on:
  push:
    branches:
      - feat/dt-rel-inspector

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dt-rel-inspector
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-dynrel.rs tests/dynamic_rel.rs
          git commit -m "style: apply rustfmt"
          git push origin HEAD:feat/dt-rel-inspector
