name: conquest-format-fix

on:
  push:
    branches:
      - conquest/pt-interp-inspector

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-interp.rs tests/dynamic_interp.rs
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:conquest/pt-interp-inspector
