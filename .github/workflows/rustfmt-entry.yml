name: Rustfmt entry slice

on:
  push:
    branches:
      - feat/checked-entry-point

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.event.head_commit.message != 'chore: apply canonical rustfmt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/checked-entry-point
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/bin/mini-elf-entry.rs tests/dynamic_entry_point.rs
            git commit -m "chore: apply canonical rustfmt"
            git push origin HEAD:feat/checked-entry-point
          fi
