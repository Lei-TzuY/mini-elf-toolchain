name: Fix LSDA relative Clippy

on:
  push:
    branches:
      - feat/lsda-relative-ttype-slots

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lsda-relative-ttype-slots
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Apply machine-applicable Clippy fixes
        run: |
          cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features -- -D warnings
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/mini-elf-lsda-relative.rs tests/dynamic_lsda_relative.rs
          git commit -m "fix: satisfy LSDA relative Clippy checks"
          git push origin HEAD:feat/lsda-relative-ttype-slots
