name: Temporary rustfmt DTPOFF32

on:
  push:
    branches:
      - feat/dtpoff32-gnu-hash

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dtpoff32-gnu-hash
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/mini-elf-dynrela-dtpoff32.rs tests/dynamic_rela_dtpoff32_gnu_hash.rs
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:feat/dtpoff32-gnu-hash
