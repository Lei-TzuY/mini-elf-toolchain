name: Conquest clippy diagnostic
on:
  push:
    branches:
      - conquest/readelf-program-headers
permissions:
  contents: write
jobs:
  clippy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/readelf-program-headers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings > clippy.log 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clippy.log
          git commit -m "Capture clippy diagnostics"
          git push origin HEAD:conquest/readelf-program-headers
