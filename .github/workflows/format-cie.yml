name: Format CIE branch

on:
  push:
    branches:
      - conquest/cie-augmentation-validation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/cie-augmentation-validation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "LeiZ"
            git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
            git add src/bin/mini-elf-eh-frame-cie.rs tests/dynamic_eh_frame_cie.rs
            git commit -m "style: apply rustfmt"
            git push origin HEAD:conquest/cie-augmentation-validation
          fi
