name: Conquest Diagnostic

on:
  push:
    branches:
      - conquest/eh-frame-zr-encoding

permissions:
  contents: write

jobs:
  diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/eh-frame-zr-encoding
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture focused test
        run: |
          cargo test --test dynamic_eh_frame_encoding -- --nocapture > conquest-diagnostic.txt 2>&1 || true
          cat conquest-diagnostic.txt
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add conquest-diagnostic.txt
          git commit -m "ci: capture focused diagnostic" || exit 0
          git push
