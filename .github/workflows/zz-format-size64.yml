name: Format SIZE64 branch

on:
  push:
    branches:
      - feat/gnu-hash-size64

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gnu-hash-size64
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bin/mini-elf-dynrela-size64.rs tests/dynamic_rela_size64_gnu_hash.rs
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:feat/gnu-hash-size64
