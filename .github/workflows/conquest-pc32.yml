name: Conquest PC32 GNU hash

on:
  push:
    branches:
      - conquest/gnu-hash-pc32

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'chore: bootstrap PC32 GNU hash slice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/gnu-hash-pc32
      - name: Implement bounded GNU hash support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/bin/mini-elf-dynrela-pc32.rs')
          s = p.read_text()
          s = s.replace('const DT_SYMENT: i64 = 11;\nconst R_X86_64_PC32: u32 = 2;', 'const DT_SYMENT: i64 = 11;\nconst DT_GNU_HASH: i64 = 0x6fff_fef5;\nconst R_X86_64_PC32: u32 = 2;')
          s = s.replace('    let mut hash = None;\n    let mut sym = None;', '    let mut hash = None;\n    let mut gnu_hash = None;\n    let mut sym = None;')
          s = s.replace('            DT_HASH => &mut hash,\n            DT_SYMTAB => &mut sym,', '            DT_HASH => &mut hash,\n            DT_GNU_HASH => &mut gnu_hash,\n            DT_SYMTAB => &mut sym,')
          s = s.replace('    let hash = req(hash, "DT_HASH")?;\n    let sym = req(sym, "DT_SYMTAB")?;', '    let sym = req(sym, "DT_SYMTAB")?;')
          old = '''    let hb = map(b, &hs, hash, 8, 0, "DT_HASH")?;\n    let n = u64::from(u32at(hb, 4));\n    if n == 0 {\n        return Err("DT_HASH reports zero symbols".into());\n    }\n'''
          new = '''    let n = dynamic_symbol_count(b, &hs, hash, gnu_hash)?;\n    if n == 0 {\n        return Err("dynamic hash metadata reports zero symbols".into());\n    }\n'''
          if old not in s:
              raise SystemExit('PC32 DT_HASH block not found')
          s = s.replace(old, new)
          marker = '\nfn phdrs(b: &[u8]) -> Result<Vec<Phdr>, String> {'
          helper = r'''

fn dynamic_symbol_count(
    b: &[u8],
    hs: &[Phdr],
    hash: Option<u64>,
    gnu_hash: Option<u64>,
) -> Result<u64, String> {
    if let Some(address) = hash {
        let header = map(b, hs, address, 8, 0, "DT_HASH header")?;
        return Ok(u64::from(u32at(header, 4)));
    }
    let address = gnu_hash.ok_or_else(|| {
        "R_X86_64_PC32 validation requires DT_HASH or DT_GNU_HASH to bound DT_SYMTAB".to_owned()
    })?;
    gnu_hash_symbol_count(b, hs, address)
}

fn gnu_hash_symbol_count(b: &[u8], hs: &[Phdr], address: u64) -> Result<u64, String> {
    let header = map(b, hs, address, 16, 0, "DT_GNU_HASH header")?;
    let bucket_count = u32at(header, 0);
    let symbol_offset = u32at(header, 4);
    let bloom_count = u32at(header, 8);
    if bucket_count == 0 {
        return Err("DT_GNU_HASH bucket count must be non-zero".into());
    }
    if bloom_count == 0 || !bloom_count.is_power_of_two() {
        return Err(format!(
            "DT_GNU_HASH bloom count {bloom_count} must be a non-zero power of two"
        ));
    }
    let bloom_bytes = u64::from(bloom_count)
        .checked_mul(8)
        .ok_or("DT_GNU_HASH bloom byte size overflows u64")?;
    let bucket_bytes = u64::from(bucket_count)
        .checked_mul(4)
        .ok_or("DT_GNU_HASH bucket byte size overflows u64")?;
    let prefix_size = 16u64
        .checked_add(bloom_bytes)
        .and_then(|value| value.checked_add(bucket_bytes))
        .ok_or("DT_GNU_HASH prefix byte size overflows u64")?;
    let prefix = map(b, hs, address, prefix_size, 0, "DT_GNU_HASH prefix")?;
    let bucket_start = usize::try_from(
        16u64
            .checked_add(bloom_bytes)
            .ok_or("DT_GNU_HASH bucket offset overflows u64")?,
    )
    .map_err(|_| "DT_GNU_HASH bucket offset does not fit usize")?;
    let chain_address = address
        .checked_add(prefix_size)
        .ok_or("DT_GNU_HASH chain address overflows u64")?;
    let mut count = symbol_offset;
    for bucket_index in 0..bucket_count {
        let bucket_delta = u64::from(bucket_index)
            .checked_mul(4)
            .ok_or("DT_GNU_HASH bucket offset overflows u64")?;
        let offset = bucket_start
            .checked_add(
                usize::try_from(bucket_delta)
                    .map_err(|_| "DT_GNU_HASH bucket offset does not fit usize")?,
            )
            .ok_or("DT_GNU_HASH bucket offset overflows usize")?;
        let start_symbol = u32at(prefix, offset);
        if start_symbol == 0 {
            continue;
        }
        if start_symbol < symbol_offset {
            return Err(format!(
                "DT_GNU_HASH bucket {bucket_index} starts at symbol {start_symbol}, below symbol offset {symbol_offset}"
            ));
        }
        let mut symbol = start_symbol;
        loop {
            let chain_index = symbol
                .checked_sub(symbol_offset)
                .ok_or("DT_GNU_HASH chain index underflows")?;
            let chain_offset = u64::from(chain_index)
                .checked_mul(4)
                .ok_or("DT_GNU_HASH chain offset overflows u64")?;
            let entry_address = chain_address
                .checked_add(chain_offset)
                .ok_or("DT_GNU_HASH chain address overflows u64")?;
            let entry = map(
                b,
                hs,
                entry_address,
                4,
                0,
                &format!("DT_GNU_HASH bucket {bucket_index} chain entry for symbol {symbol}"),
            )?;
            let next = symbol
                .checked_add(1)
                .ok_or("DT_GNU_HASH symbol index overflows u32")?;
            if u32at(entry, 0) & 1 != 0 {
                count = count.max(next);
                break;
            }
            symbol = next;
        }
    }
    Ok(u64::from(count))
}
'''
          if marker not in s:
              raise SystemExit('PC32 helper insertion marker not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)

          t = Path('tests/dynamic_rela_pc32.rs')
          x = t.read_text()
          x = x.replace('const DT_HASH: i64 = 4;\nconst DT_RELA: i64 = 7;', 'const DT_HASH: i64 = 4;\nconst DT_RELA: i64 = 7;\nconst DT_GNU_HASH: i64 = 0x6fff_fef5;')
          insert_after = '''fn fixture(d: &Path) -> PathBuf {\n'''
          # Append a dedicated GNU-hash fixture after the existing fixture function by locating `fn run`.
          run_marker = '\nfn run(ps: &[&Path]) -> Output {'
          gnu_fixture = r'''

fn gnu_hash_fixture(d: &Path) -> PathBuf {
    let s = d.join("gnu.s");
    let o = d.join("gnu.o");
    let so = d.join("gnu.so");
    fs::write(
        &s,
        ".text\n.globl dummy\ndummy:\nret\n.data\n.globl slot\nslot:\n.long external - .\n",
    )
    .unwrap();
    assert!(Command::new("as")
        .args(["-o", o.to_str().unwrap(), s.to_str().unwrap()])
        .status()
        .unwrap()
        .success());
    assert!(Command::new("ld")
        .args([
            "-shared",
            "--hash-style=gnu",
            "-o",
            so.to_str().unwrap(),
            o.to_str().unwrap(),
        ])
        .status()
        .unwrap()
        .success());
    so
}
'''
          if run_marker not in x:
              raise SystemExit('PC32 test run marker not found')
          x = x.replace(run_marker, gnu_fixture + run_marker, 1)
          test_marker = '\n#[test]\nfn rejects_bad_symbol_index() {'
          gnu_test = r'''

#[test]
fn validates_gnu_hash_only_pc32() {
    let d = temp("gnu-hash");
    let so = gnu_hash_fixture(&d);
    let dyns = Command::new("readelf")
        .args(["-dW", so.to_str().unwrap()])
        .output()
        .unwrap();
    assert!(dyns.status.success());
    let dyntext = String::from_utf8_lossy(&dyns.stdout);
    assert!(dyntext.contains("(GNU_HASH)"), "{dyntext}");
    assert!(!dyntext.contains(" (HASH)"), "{dyntext}");
    let rels = Command::new("readelf")
        .args(["-rW", so.to_str().unwrap()])
        .output()
        .unwrap();
    assert!(rels.status.success());
    assert!(String::from_utf8_lossy(&rels.stdout).contains("R_X86_64_PC32"));
    let out = run(&[&so]);
    assert!(out.status.success(), "{}", String::from_utf8_lossy(&out.stderr));
    assert!(String::from_utf8_lossy(&out.stdout).contains("binding=external"));
    fs::remove_dir_all(d).unwrap();
}

#[test]
fn rejects_malformed_gnu_hash_bloom_count() {
    let d = temp("gnu-hash-bloom");
    let so = gnu_hash_fixture(&d);
    let mut b = fs::read(&so).unwrap();
    let hash = tag(&b, DT_GNU_HASH);
    let o = map(&b, hash);
    b[o + 8..o + 12].copy_from_slice(&0u32.to_le_bytes());
    let bad = d.join("bad.so");
    fs::write(&bad, b).unwrap();
    let out = run(&[&bad]);
    assert!(!out.status.success());
    assert!(String::from_utf8_lossy(&out.stderr).contains("bloom count"));
    fs::remove_dir_all(d).unwrap();
}
'''
          if test_marker not in x:
              raise SystemExit('PC32 test insertion marker not found')
          x = x.replace(test_marker, gnu_test + test_marker, 1)
          t.write_text(x)

          d = Path('docs/pc32.md')
          doc = d.read_text().rstrip() + '\n\nWhen SysV `DT_HASH` is absent, the validator also accepts GNU-hash-only images and derives the dynamic-symbol upper bound from checked `DT_GNU_HASH` bucket, Bloom, and chain metadata. SysV `DT_HASH` remains authoritative when present. The regression suite builds a real `ld --hash-style=gnu` shared object, verifies it with GNU `readelf`, and rejects malformed GNU-hash Bloom metadata.\n'
          d.write_text(doc)
          PY
          cargo fmt --all
          cargo test --test dynamic_rela_pc32
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add src/bin/mini-elf-dynrela-pc32.rs tests/dynamic_rela_pc32.rs docs/pc32.md
          git commit -m 'feat: accept GNU-hash-only R_X86_64_PC32 images'
          git push origin HEAD:conquest/gnu-hash-pc32
