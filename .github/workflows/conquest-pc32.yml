name: Conquest PC32 GNU hash

on:
  push:
    branches:
      - conquest/gnu-hash-pc32

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/gnu-hash-pc32
      - name: Apply and verify bounded slice
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" != "chore: run PC32 GNU hash helper" ]; then
            echo "No implementation action required for this commit."
            exit 0
          fi
          python3 tools/conquest_pc32.py
          cargo fmt --all
          cargo test --test dynamic_rela_pc32
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add src/bin/mini-elf-dynrela-pc32.rs tests/dynamic_rela_pc32.rs docs/pc32.md
          git commit -m 'feat: accept GNU-hash-only R_X86_64_PC32 images'
          git push origin HEAD:conquest/gnu-hash-pc32
