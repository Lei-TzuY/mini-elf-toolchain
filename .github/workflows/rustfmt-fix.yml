name: rustfmt-fix

on:
  push:
    branches:
      - conquest/bil-218-pltoff64

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/bil-218-pltoff64
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/x86_64_relocations.rs tests/x86_64_pltoff64.rs tests/cli_pltoff64_gnu.rs
          git commit -m "Apply rustfmt"
          git push origin HEAD:conquest/bil-218-pltoff64
