name: Rustfmt candidate fix

on:
  push:
    branches:
      - conquest/dynrela-symbol-names

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dynrela-symbol-names
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/mini-elf-dynrela.rs tests/dynamic_rela.rs
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:conquest/dynrela-symbol-names
