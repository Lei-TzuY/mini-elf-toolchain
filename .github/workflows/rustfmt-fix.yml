name: Rustfmt Fix

on:
  push:
    branches:
      - conquest/dynamic-init-arrays

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dynamic-init-arrays
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatter result
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/bin/mini-elf-dyninit.rs tests/dynamic_init_arrays.rs
          git commit -m "style: apply stable rustfmt"
          git push origin HEAD:conquest/dynamic-init-arrays
