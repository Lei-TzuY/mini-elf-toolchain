name: Clippy Diagnostic Verneed Branch

on:
  push:
    branches:
      - conquest/dynamic-verneed

permissions:
  contents: write

jobs:
  clippy-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dynamic-verneed
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture clippy output
        run: |
          cargo clippy --all-targets --all-features -- -D warnings > .ci-verneed-clippy.txt 2>&1 || true
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-verneed-clippy.txt
          git commit -m "ci: capture clippy diagnostic"
          git push origin HEAD:conquest/dynamic-verneed
