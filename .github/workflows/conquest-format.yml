name: Conquest format candidate

on:
  push:
    branches:
      - conquest/dt-versym-inspection

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dt-versym-inspection
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-versym.rs tests/dynamic_versym.rs
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:conquest/dt-versym-inspection
