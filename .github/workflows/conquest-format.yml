name: Conquest Format

on:
  push:
    branches:
      - conquest/gnu-dynamic-hash

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/gnu-dynamic-hash
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "LeiZ"
            git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
            git add src/bin/mini-elf-gnuhash.rs tests/gnu_dynamic_hash.rs
            git commit -m "style: apply canonical rustfmt"
            git push origin HEAD:conquest/gnu-dynamic-hash
          fi
