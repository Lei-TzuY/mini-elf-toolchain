name: Conquest Format

on:
  push:
    branches: [conquest/bil-206-gotoff64]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/bil-206-gotoff64
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "LeiZ"
            git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
            git add '*.rs'
            git commit -m "Apply canonical Rust formatting"
            git push origin HEAD:conquest/bil-206-gotoff64
          fi
