name: Conquest Format
on:
  push:
    branches:
      - conquest/eh-frame-fde-range
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/eh-frame-fde-range
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-eh-frame-encoding.rs tests/dynamic_eh_frame_encoding.rs
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:conquest/eh-frame-fde-range
