name: Conquest Format

on:
  push:
    branches:
      - conquest/dynrela-glob-dat

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore: apply canonical rustfmt')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dynrela-glob-dat
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/mini-elf-dynrela-glob-dat.rs tests/dynamic_rela_glob_dat.rs
          git commit -m "chore: apply canonical rustfmt"
          git push origin HEAD:conquest/dynrela-glob-dat
