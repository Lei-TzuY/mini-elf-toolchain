name: Conquest Format

on:
  push:
    branches:
      - conquest/eh-frame-lsda

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/eh-frame-lsda
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-eh-frame-lsda.rs tests/dynamic_eh_frame_lsda.rs
          git commit -m "style: format corrected LSDA regression"
          git push origin HEAD:conquest/eh-frame-lsda
