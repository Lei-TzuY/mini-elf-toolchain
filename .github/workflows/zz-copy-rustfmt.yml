name: COPY Rustfmt
on:
  push:
    branches:
      - conquest/copy-reloc-validation
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/copy-reloc-validation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/bin/mini-elf-copy-reloc.rs tests/dynamic_copy_reloc.rs
            git commit -m "style: apply canonical rustfmt"
            git push origin HEAD:conquest/copy-reloc-validation
          fi
