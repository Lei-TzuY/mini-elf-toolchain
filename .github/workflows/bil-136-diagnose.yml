name: BIL-136 test diagnostic

on:
  push:
    branches:
      - bil-136-library-path-equals

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bil-136-library-path-equals
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture focused test output
        run: |
          set +e
          cargo test --test cli_library_path_gnu -- --nocapture > bil-136-test.log 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "$status" >> bil-136-test.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bil-136-test.log
          git commit -m "Capture BIL-136 test diagnostic"
          git push origin HEAD:bil-136-library-path-equals
