name: Clippy Fix Verneed Branch

on:
  push:
    branches:
      - conquest/dynamic-verneed

permissions:
  contents: write

jobs:
  clippy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dynamic-verneed
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply compile fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/bin/mini-elf-verneed.rs')
          text = path.read_text()
          old = 'if header.program_header_entry_size as usize != ELF64_PROGRAM_HEADER_SIZE {'
          new = 'if header.program_header_entry_size != ELF64_PROGRAM_HEADER_SIZE {'
          if old not in text:
              raise SystemExit('expected source pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: cargo fmt --all
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/mini-elf-verneed.rs
          git commit -m "fix: compare program header size consistently"
          git push origin HEAD:conquest/dynamic-verneed
