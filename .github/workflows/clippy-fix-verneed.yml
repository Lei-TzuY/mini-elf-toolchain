name: Clippy Fix Verneed Branch

on:
  push:
    branches:
      - conquest/dynamic-verneed

permissions:
  contents: write

jobs:
  clippy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dynamic-verneed
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy --fix --all-targets --all-features --allow-dirty --allow-staged -- -D warnings || true
      - run: cargo fmt --all
      - name: Commit machine-applicable fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/mini-elf-verneed.rs tests/dynamic_verneed.rs
          git commit -m "fix: apply clippy suggestions"
          git push origin HEAD:conquest/dynamic-verneed
