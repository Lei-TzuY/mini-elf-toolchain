name: Conquest format artifact

on:
  push:
    branches:
      - conquest/bil-157-split-long-library-forms

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: |
            src/library_search.rs
            tests/cli_library_long_gnu.rs
