name: jump-slot-format
on:
  push:
    branches: [feat/dynrela-jump-slot]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/mini-elf-dynrela-jump-slot.rs tests/dynamic_rela_jump_slot.rs
          git commit -m "style: apply rustfmt to JUMP_SLOT slice"
          git push
