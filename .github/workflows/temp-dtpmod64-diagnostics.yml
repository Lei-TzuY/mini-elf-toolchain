name: Temporary DTPMOD64 diagnostics
on:
  push:
    branches:
      - feat/dynrela-dtpmod64
jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture focused test output
        run: |
          set +e
          cargo test --test dynamic_rela_dtpmod64 -- --nocapture > dtpmod64-test.log 2>&1
          echo $? > dtpmod64-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: dtpmod64-diagnostics
          path: |
            dtpmod64-test.log
            dtpmod64-exit.txt
