name: Conquest RELR diagnostic

on:
  push:
    branches:
      - conquest/dt-relr-inspector

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dt-relr-inspector
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture focused test output
        run: |
          set +e
          cargo test --test dynamic_relr -- --nocapture > /tmp/relr-test.log 2>&1
          status=$?
          cp /tmp/relr-test.log conquest-relr-test.log
          printf '\nEXIT_STATUS=%s\n' "$status" >> conquest-relr-test.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conquest-relr-test.log
          git commit -m "ci: capture RELR focused test output"
          git push origin HEAD:conquest/dt-relr-inspector
