name: Temporary format DTPMOD64
on:
  push:
    branches:
      - feat/dynrela-dtpmod64
jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/mini-elf-dynrela-dtpmod64.rs tests/dynamic_rela_dtpmod64.rs
          git commit -m "style: apply canonical rustfmt"
          git push
