name: Format Diff

on:
  push:

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo fmt --all
          git diff > fmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: fmt-patch
          path: fmt.patch
