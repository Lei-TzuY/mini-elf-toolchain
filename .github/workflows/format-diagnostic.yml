name: Format diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/versym-namespace-resolution
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/bin/mini-elf-vercheck.rs tests/dynamic_vercheck.rs
            git commit -m "style: apply canonical rustfmt"
            git push origin HEAD:conquest/versym-namespace-resolution
          fi
