name: Format diagnostic

on:
  push:
    branches:
      - conquest/dynsym-sysv-runtime

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: |
            src/bin/mini-elf-dynsym.rs
            tests/dynamic_symbols.rs
