name: Format U8 slice

on:
  push:
    branches:
      - feat/dynrela-u8-gnu-hash

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynrela-u8-gnu-hash
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-dynrela-u8.rs tests/dynamic_rela_u8_gnu_hash.rs
          git commit -m "style: apply rustfmt to U8 GNU hash slice"
          git push origin HEAD:feat/dynrela-u8-gnu-hash
