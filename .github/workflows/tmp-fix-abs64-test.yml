name: Temporary fix abs64 test helper
on:
  push:
    branches: [feat/dynrela-abs64]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynrela-abs64
      - run: sed -i 's/header\.4 >= 8/header.4 >= 1/' tests/dynamic_rela_abs64.rs
      - run: rm .github/workflows/tmp-fix-abs64-test.yml
      - run: |
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add tests/dynamic_rela_abs64.rs .github/workflows/tmp-fix-abs64-test.yml
          git commit -m 'test: fix non-writable target fixture selection'
          git push origin HEAD:feat/dynrela-abs64
