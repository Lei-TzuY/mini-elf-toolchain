name: Format conquest candidate

on:
  push:
    branches:
      - conquest/versym-verdef-names

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/versym-verdef-names
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/mini-elf-versym.rs tests/dynamic_versym_verdef_names.rs
          git commit -m "style: apply rustfmt"
          git push origin HEAD:conquest/versym-verdef-names
