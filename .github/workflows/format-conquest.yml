name: Format Conquest

on:
  push:
    branches:
      - conquest/dynrela-gnu-hash

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dynrela-gnu-hash
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add src/bin/mini-elf-dynrela.rs tests/dynamic_rela_gnu_hash.rs
          git commit -m "style: apply rustfmt"
          git push origin HEAD:conquest/dynrela-gnu-hash
