name: Format capture
on:
  push:
    branches:
      - feat/mixed-hash-external-resolve
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-files
          path: |
            src/bin/mini-elf-dynamic-hash-resolve.rs
            tests/dynamic_hash_resolve.rs
