name: Bootstrap JUMP_SLOT GNU hash slice
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jump-slot-gnu-hash
      - name: Apply verified implementation script
        shell: bash
        run: |
          sed -n '/        run: |/,$p' .github/workflows/jump-slot-gnu-hash-apply.yml | tail -n +2 | sed 's/^          //' > /tmp/apply.sh
          bash /tmp/apply.sh
