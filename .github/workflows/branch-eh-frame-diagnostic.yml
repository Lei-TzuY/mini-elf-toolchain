name: Branch EH frame diagnostic

on:
  push:
    branches: [conquest/gnu-eh-frame-segment]

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/gnu-eh-frame-segment
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture focused test output
        run: |
          if [ -f .ci-eh-frame-test.log ]; then
            exit 0
          fi
          cargo test --test dynamic_eh_frame -- --nocapture > .ci-eh-frame-test.log 2>&1 || true
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add .ci-eh-frame-test.log
          git commit -m 'ci: capture focused EH frame test log'
          git push origin HEAD:conquest/gnu-eh-frame-segment
