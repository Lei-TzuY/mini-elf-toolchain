name: CI

on:
  push:
    branches: [main, conquest/gnu-property-isa-needed]
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/gnu-property-isa-needed
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt on diagnostic push
        if: github.event_name == 'push'
        run: |
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-gnu-property.rs tests/dynamic_gnu_property.rs
          git commit -m "style: apply rustfmt"
          git push origin HEAD:conquest/gnu-property-isa-needed
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
