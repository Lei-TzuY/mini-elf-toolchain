name: CI

on:
  push:
    branches: [main, feat/dynrela-glob-dat-gnu-hash]
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynrela-glob-dat-gnu-hash
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Canonical format
        run: cargo fmt --all
      - name: Commit format and restore CI
        run: |
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add src/bin/mini-elf-dynrela-glob-dat.rs tests/dynamic_rela_glob_dat_gnu_hash.rs
          git commit -m 'style: apply canonical rustfmt to GLOB_DAT slice' || true
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -f .github/workflows/format-glob-dat.yml || true
          git add .github/workflows/ci.yml
          git commit -m 'chore: restore CI after formatting'
          git push origin HEAD:feat/dynrela-glob-dat-gnu-hash
