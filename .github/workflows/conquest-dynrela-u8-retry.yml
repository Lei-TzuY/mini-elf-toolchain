name: Conquest dynrela u8 retry

on:
  push:
    branches:
      - feat/dynrela-u8

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate and validate bounded R_X86_64_8 slice
        shell: bash
        run: |
          set -euo pipefail
          cp src/bin/mini-elf-dynrela-u16.rs src/bin/mini-elf-dynrela-u8.rs
          cp tests/dynamic_rela_u16.rs tests/dynamic_rela_u8.rs
          cp docs/mini-elf-dynrela-u16.md docs/mini-elf-dynrela-u8.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/bin/mini-elf-dynrela-u8.rs'); s=p.read_text()
          s=s.replace('mini-elf-dynrela-u16','mini-elf-dynrela-u8').replace('R_X86_64_16','R_X86_64_8').replace('const R_X86_64_8: u32 = 12;','const R_X86_64_8: u32 = 14;').replace('offset,\n            2,\n            PF_W,','offset,\n            1,\n            PF_W,').replace('let value16 = u16::try_from(relocated)','let value8 = u8::try_from(relocated)').replace('does not fit unsigned 16 bits','does not fit unsigned 8 bits').replace('result={value16}','result={value8}')
          p.write_text(s)
          p=Path('tests/dynamic_rela_u8.rs'); s=p.read_text()
          s=s.replace('mini-elf-dynrela-u16','mini-elf-dynrela-u8').replace('R_X86_64_16','R_X86_64_8').replace('const R_X86_64_8: u32 = 12;','const R_X86_64_8: u32 = 14;').replace('const DT_HASH: i64 = 4;\n','const DT_HASH: i64 = 4;\nconst DT_SYMTAB: i64 = 6;\n')
          old='''            bytes[cursor + 8..cursor + 16]\n                .copy_from_slice(&((symbol << 32) | u64::from(R_X86_64_8)).to_le_bytes());\n            break;'''
          new='''            bytes[cursor + 8..cursor + 16]\n                .copy_from_slice(&((symbol << 32) | u64::from(R_X86_64_8)).to_le_bytes());\n            let symtab = map_vaddr(&bytes, dynamic_tag(&bytes, DT_SYMTAB));\n            let symbol_value = read_u64(&bytes, symtab + symbol as usize * 24 + 8);\n            let addend = 0x80_i64 - i64::try_from(symbol_value).unwrap();\n            bytes[cursor + 16..cursor + 24].copy_from_slice(&addend.to_le_bytes());\n            break;'''
          assert old in s; s=s.replace(old,new)
          s=s.replace('validates_gnu_recognized_16_relocation','validates_gnu_recognized_8_relocation').replace('rejects_result_outside_unsigned_16_bits','rejects_result_outside_unsigned_8_bits').replace('unsigned 16 bits','unsigned 8 bits').replace('"0x10000"','"0x100"').replace('u16-good','u8-good').replace('u16-negative','u8-negative').replace('u16-index','u8-index').replace('u16-target','u8-target').replace('u16-overflow','u8-overflow').replace('u16-atomic','u8-atomic')
          old='''    bytes[rela + 16..rela + 24].copy_from_slice(&(-1_i64).to_le_bytes());\n    let patched = dir.join("negative.so");'''
          new='''    let addend = read_i64(&bytes, rela + 16) - 1;\n    assert!(addend < 0);\n    bytes[rela + 16..rela + 24].copy_from_slice(&addend.to_le_bytes());\n    let patched = dir.join("negative.so");'''
          assert old in s; s=s.replace(old,new).replace('assert!(String::from_utf8_lossy(&output.stdout).contains("addend=-1"));','assert!(String::from_utf8_lossy(&output.stdout).contains("result=127"));')
          p.write_text(s)
          p=Path('docs/mini-elf-dynrela-u8.md'); s=p.read_text().replace('mini-elf-dynrela-u16','mini-elf-dynrela-u8').replace('R_X86_64_16','R_X86_64_8').replace('type 12','type 14').replace('unsigned 16-bit','unsigned 8-bit').replace('unsigned 16 bits','unsigned 8 bits').replace('unsigned-16','unsigned-8').replace('two-byte','one-byte').replace('2-byte','1-byte'); p.write_text(s)
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit clean slice
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/conquest-dynrela-u8.yml .github/workflows/conquest-dynrela-u8-retry.yml
          git add src/bin/mini-elf-dynrela-u8.rs tests/dynamic_rela_u8.rs docs/mini-elf-dynrela-u8.md
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git commit -m 'feat: validate bounded dynamic R_X86_64_8 relocations'
          git push origin HEAD:feat/dynrela-u8
