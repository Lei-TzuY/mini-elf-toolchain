name: Conquest Diagnose LSDA Clippy

on:
  push:
    branches:
      - conquest/eh-frame-lsda
    paths:
      - .github/workflows/conquest-clippy-diagnose.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/eh-frame-lsda
      - name: Remove obsolete helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('tests/dynamic_eh_frame_lsda.rs')
          text = path.read_text()
          updated, count = re.subn(
              r'fn map_offset_to_vaddr\(.*?\n\}\n\n(?=fn first_fde_address)',
              '',
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one obsolete helper, removed {count}')
          path.write_text(updated)
          PY
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add tests/dynamic_eh_frame_lsda.rs
          git commit -m "test: remove obsolete LSDA mapping helper"
          git push origin HEAD:conquest/eh-frame-lsda
