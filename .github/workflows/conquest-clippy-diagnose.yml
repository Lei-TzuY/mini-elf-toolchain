name: Conquest Diagnose LSDA Clippy

on:
  push:
    branches:
      - conquest/eh-frame-lsda
    paths:
      - .github/workflows/conquest-clippy-diagnose.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/eh-frame-lsda
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture clippy output
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > .conquest-lsda-clippy.log 2>&1
          status=$?
          echo "EXIT_STATUS=$status" >> .conquest-lsda-clippy.log
          exit 0
      - name: Commit diagnostic log
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add .conquest-lsda-clippy.log
          git commit -m "ci: capture LSDA clippy diagnostics"
          git push origin HEAD:conquest/eh-frame-lsda
