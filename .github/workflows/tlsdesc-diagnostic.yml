name: TLSDESC diagnostic

on:
  push:
    branches: [feat/dynrela-tlsdesc]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynrela-tlsdesc
      - uses: dtolnay/rust-toolchain@stable
      - name: Run focused test
        shell: bash
        run: |
          set +e
          cargo test --test dynamic_rela_tlsdesc -- --nocapture > tlsdesc-test.log 2>&1
          status=$?
          cat tlsdesc-test.log
          echo "$status" > tlsdesc-test.status
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tlsdesc-test.log tlsdesc-test.status
          git commit -m "ci: capture TLSDESC focused test diagnostics"
          git push origin HEAD:feat/dynrela-tlsdesc
