name: Temporary rustfmt dynrela abs64
on:
  push:
    branches: [feat/dynrela-abs64]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynrela-abs64
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - run: rm .github/workflows/tmp-fmt-dynrela-abs64.yml
      - run: |
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add src/bin/mini-elf-dynrela-abs64.rs tests/dynamic_rela_abs64.rs .github/workflows/tmp-fmt-dynrela-abs64.yml
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply canonical rustfmt'
            git push origin HEAD:feat/dynrela-abs64
          fi
