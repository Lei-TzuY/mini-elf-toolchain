name: pc64-format
on:
  push:
    branches: [conquest/dynrela-pc64]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dynrela-pc64
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/bin/mini-elf-dynrela-pc64.rs tests/dynamic_rela_pc64.rs
            git commit -m "style: apply rustfmt to PC64 slice"
            git push origin HEAD:conquest/dynrela-pc64
          fi
