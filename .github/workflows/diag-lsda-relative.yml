name: Diagnose LSDA relative

on:
  push:
    branches:
      - feat/lsda-relative-ttype-slots

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lsda-relative-ttype-slots
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture Clippy diagnostics
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > clippy-lsda-relative.log 2>&1
          status=$?
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clippy-lsda-relative.log
          git commit -m "ci: capture LSDA relative clippy diagnostics"
          git push origin HEAD:feat/lsda-relative-ttype-slots
          exit $status
