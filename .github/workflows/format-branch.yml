name: Format Branch

on:
  push:
    branches: [conquest/gnu-property-isa-needed]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/gnu-property-isa-needed
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-gnu-property.rs tests/dynamic_gnu_property.rs
          git commit -m "style: apply rustfmt"
          git push origin HEAD:conquest/gnu-property-isa-needed
