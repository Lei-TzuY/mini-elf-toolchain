name: Format branch

on:
  push:
    branches:
      - conquest/lsda-header-envelope

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/lsda-header-envelope
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -- src/bin/mini-elf-lsda-header.rs tests/dynamic_lsda_header.rs
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:conquest/lsda-header-envelope
