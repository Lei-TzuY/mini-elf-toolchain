name: Format branch

on:
  push:
    branches:
      - feat/gnu-hash-symbol-lookup

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gnu-hash-symbol-lookup
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/mini-elf-gnu-hash-lookup.rs tests/gnu_hash_lookup.rs
          git commit -m "style: apply rustfmt"
          git push origin HEAD:feat/gnu-hash-symbol-lookup
