name: Format GLOB_DAT GNU hash

on:
  push:
    branches: [feat/dynrela-glob-dat-gnu-hash]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynrela-glob-dat-gnu-hash
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: git config user.name LeiZ && git config user.email 52287354+Lei-TzuY@users.noreply.github.com && git add src/bin/mini-elf-dynrela-glob-dat.rs tests/dynamic_rela_glob_dat_gnu_hash.rs && git commit -m 'style: apply canonical rustfmt to GLOB_DAT slice' || true
      - run: git rm .github/workflows/format-glob-dat.yml && git commit -m 'chore: remove formatter workflow' && git push origin HEAD:feat/dynrela-glob-dat-gnu-hash
