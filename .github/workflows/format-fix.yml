name: Format Fix

on:
  push:
    branches: [feat/eh-frame-zpr-personality]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/eh-frame-zpr-personality
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-eh-frame-personality.rs tests/dynamic_eh_frame_personality.rs
          git commit -m "chore: apply rustfmt"
          git push origin HEAD:feat/eh-frame-zpr-personality
