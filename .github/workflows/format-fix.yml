name: Format fix
on:
  push:
    branches: [bil-149-image-base-equals]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bil-149-image-base-equals
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/image_base.rs tests/cli_image_base_equals_gnu.rs
          git commit -m "Normalize rustfmt output"
          git push origin HEAD:bil-149-image-base-equals
