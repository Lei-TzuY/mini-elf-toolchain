name: Branch format fix

on:
  push:
    branches:
      - conquest/bil-272-nm-size-sort

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Apply rustfmt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/bil-272-nm-size-sort
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add src/bin/mini-elf-nm.rs tests/nm_size_sort.rs
          git commit -m 'Apply rustfmt'
          git push origin HEAD:conquest/bil-272-nm-size-sort
