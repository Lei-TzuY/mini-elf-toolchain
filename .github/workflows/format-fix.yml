name: Format Fix

on:
  push:
    branches:
      - bil-242-nm-undefined-only

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bil-242-nm-undefined-only
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-nm.rs tests/mini_elf_nm.rs
          git commit -m "Apply canonical rustfmt"
          git push origin HEAD:bil-242-nm-undefined-only
