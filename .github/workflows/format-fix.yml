name: Branch formatter

on:
  push:
    branches:
      - feat/vercheck-symbol-bindings

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vercheck-symbol-bindings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/mini-elf-vercheck.rs tests/dynamic_vercheck_bindings.rs
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:feat/vercheck-symbol-bindings
