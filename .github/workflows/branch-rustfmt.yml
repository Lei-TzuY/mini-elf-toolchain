name: Branch rustfmt

on:
  push:
    branches:
      - conquest/dyninit-preinit-array

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dyninit-preinit-array
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Lei-TzuY"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-dyninit.rs tests/dynamic_preinit_arrays.rs
          git commit -m "style: apply stable rustfmt"
          git push origin HEAD:conquest/dyninit-preinit-array
