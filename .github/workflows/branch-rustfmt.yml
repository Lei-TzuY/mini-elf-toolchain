name: Branch rustfmt helper

on:
  push:
    branches:
      - conquest/dynrelr-load-bias

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.event.head_commit.message != 'chore: apply rustfmt canonical output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dynrelr-load-bias
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-dynrelr.rs tests/dynamic_relr_load_bias.rs
          git commit -m "chore: apply rustfmt canonical output"
          git push origin HEAD:conquest/dynrelr-load-bias
