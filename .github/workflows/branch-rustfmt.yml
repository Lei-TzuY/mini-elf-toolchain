name: Branch rustfmt
on:
  push:
    branches:
      - conquest/script-equals-form
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/script-equals-form
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: |
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/image_base.rs tests/cli_linker_script_gnu.rs
          git commit -m "Apply stable rustfmt"
          git push origin HEAD:conquest/script-equals-form
