name: Branch Rustfmt

on:
  push:
    branches:
      - conquest/eh-frame-executable-ranges

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: apply canonical rustfmt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "LeiZ"
            git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
            git add src/bin/mini-elf-eh-frame-exec.rs tests/dynamic_eh_frame_exec.rs
            git commit -m "chore: apply canonical rustfmt"
            git push origin HEAD:conquest/eh-frame-executable-ranges
          fi
