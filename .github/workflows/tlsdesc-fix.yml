name: TLSDESC fix

on:
  push:
    branches: [feat/dynrela-tlsdesc]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynrela-tlsdesc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Patch GNU TLSDESC handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/bin/mini-elf-dynrela-tlsdesc.rs')
          s=p.read_text()
          s=s.replace('const DT_NULL: i64 = 0;\n', 'const DT_NULL: i64 = 0;\nconst DT_PLTRELSZ: i64 = 2;\n')
          s=s.replace('const DT_SYMENT: i64 = 11;\n', 'const DT_SYMENT: i64 = 11;\nconst DT_PLTREL: i64 = 20;\nconst DT_JMPREL: i64 = 23;\n')
          s=s.replace('    syment: Option<u64>,\n}', '    syment: Option<u64>,\n    pltrelsz: Option<u64>,\n    pltrel: Option<u64>,\n    jmprel: Option<u64>,\n}')
          s=s.replace('            DT_HASH => Some((&mut d.hash, "DT_HASH")),\n', '            DT_HASH => Some((&mut d.hash, "DT_HASH")),\n            DT_PLTRELSZ => Some((&mut d.pltrelsz, "DT_PLTRELSZ")),\n')
          s=s.replace('            DT_SYMENT => Some((&mut d.syment, "DT_SYMENT")),\n', '            DT_SYMENT => Some((&mut d.syment, "DT_SYMENT")),\n            DT_PLTREL => Some((&mut d.pltrel, "DT_PLTREL")),\n            DT_JMPREL => Some((&mut d.jmprel, "DT_JMPREL")),\n')
          old='''    let rela = req(d.rela, "DT_RELA")?;\n    let relasz = req(d.relasz, "DT_RELASZ")?;\n    let relaent = req(d.relaent, "DT_RELAENT")?;\n'''
          new='''    let (rela, relasz, relaent) = if let Some(jmprel) = d.jmprel {\n        let pltrelsz = req(d.pltrelsz, "DT_PLTRELSZ")?;\n        let pltrel = req(d.pltrel, "DT_PLTREL")?;\n        if pltrel != DT_RELA as u64 {\n            return Err("R_X86_64_TLSDESC requires a RELA-form DT_JMPREL table".into());\n        }\n        (jmprel, pltrelsz, RELAENT as u64)\n    } else {\n        (req(d.rela, "DT_RELA")?, req(d.relasz, "DT_RELASZ")?, req(d.relaent, "DT_RELAENT")?)\n    };\n'''
          if old not in s: raise SystemExit('core relocation snippet not found')
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('tests/dynamic_rela_tlsdesc.rs')
          s=p.read_text()
          s=s.replace('const DT_NULL: i64 = 0;\n', 'const DT_NULL: i64 = 0;\nconst DT_PLTRELSZ: i64 = 2;\n')
          s=s.replace('const DT_RELA: i64 = 7;\n', 'const DT_RELA: i64 = 7;\nconst DT_JMPREL: i64 = 23;\n')
          old='.section .data.rel,\\"aw\\",@progbits\\n.globl desc\\ndesc:\\n.quad 0\\n.quad 0\\n.reloc desc, R_X86_64_TLSDESC, tlsvar\\n'
          new='.text\\n.globl use_tls\\n.type use_tls,@function\\nuse_tls:\\nleaq tlsvar@TLSDESC(%rip), %rax\\ncall *tlsvar@TLSCALL(%rax)\\nret\\n'
          if old not in s: raise SystemExit('fixture snippet not found')
          s=s.replace(old,new)
          old='''fn rela(b: &[u8]) -> usize {\n    let mut c = map(b, tag(b, DT_RELA));\n    loop {\n        if u64at(b, c + 8) as u32 == R_X86_64_TLSDESC {\n            return c;\n        }\n        c += 24\n    }\n}\n'''
          new='''fn rela(b: &[u8]) -> usize {\n    let start = std::panic::catch_unwind(|| tag(b, DT_JMPREL)).unwrap_or_else(|_| tag(b, DT_RELA));\n    let mut c = map(b, start);\n    loop {\n        if u64at(b, c + 8) as u32 == R_X86_64_TLSDESC {\n            return c;\n        }\n        c += 24;\n    }\n}\n'''
          if old not in s: raise SystemExit('rela helper snippet not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --test dynamic_rela_tlsdesc -- --nocapture
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bin/mini-elf-dynrela-tlsdesc.rs tests/dynamic_rela_tlsdesc.rs
          git commit -m "fix: validate GNU TLSDESC PLT relocations"
          git push origin HEAD:feat/dynrela-tlsdesc
