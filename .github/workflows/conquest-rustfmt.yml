name: Conquest rustfmt

on:
  push:
    branches:
      - conquest/lsda-omitted-type-filter

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -- src/bin/mini-elf-lsda-header.rs tests/dynamic_lsda_type_filter_policy.rs
          git commit -m "style: apply canonical rustfmt"
          git push
