name: conquest-rustfmt

on:
  push:
    branches:
      - feat/dynrela-relative64

permissions:
  contents: write

jobs:
  fmt:
    if: ${{ !contains(github.event.head_commit.message, '[fmt]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynrela-relative64
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and push
        run: |
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src tests
          git commit -m "style: apply canonical rustfmt [fmt]"
          git push origin HEAD:feat/dynrela-relative64
