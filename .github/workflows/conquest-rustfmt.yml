name: Conquest rustfmt

on:
  push:
    branches:
      - conquest/gnu-hash-jump-slot

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/gnu-hash-jump-slot
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-dynplt-jump-slot.rs tests/dynamic_plt_jump_slot_gnu_hash.rs
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:conquest/gnu-hash-jump-slot
