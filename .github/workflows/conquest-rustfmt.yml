name: Conquest Rustfmt

on:
  push:
    branches:
      - conquest/dynrelr-inspection

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dynrelr-inspection
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-dyninit.rs tests/dynamic_init_hooks.rs
          git commit -m "chore: apply canonical rustfmt"
          git push origin HEAD:conquest/dynrelr-inspection
