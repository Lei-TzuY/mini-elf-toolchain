name: Conquest rustfmt

on:
  push:
    branches:
      - conquest/eh-frame-hdr-table

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-eh-frame.rs tests/dynamic_eh_frame.rs
          git commit -m "style: apply rustfmt to EH frame table slice"
          git push
