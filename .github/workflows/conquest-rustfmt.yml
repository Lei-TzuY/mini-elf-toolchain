name: Conquest Rustfmt
on:
  push:
    branches: [conquest/dynrela-pc16]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "LeiZ"
            git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
            git add src/bin/mini-elf-dynrela-pc16.rs tests/dynamic_rela_pc16.rs
            git commit -m "style: apply canonical rustfmt"
            git push
          fi
