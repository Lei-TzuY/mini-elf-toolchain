name: conquest-rustfmt
on:
  push:
    branches: [conquest/dynrela-pc32]
permissions:
  contents: write
jobs:
  fmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dynrela-pc32
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/bin/mini-elf-dynrela-pc32.rs tests/dynamic_rela_pc32.rs
            git commit -m 'style: apply rustfmt'
            git push origin HEAD:conquest/dynrela-pc32
          fi
