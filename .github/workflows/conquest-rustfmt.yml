name: Conquest rustfmt

on:
  push:
    branches:
      - conquest/dynrel-relative-load-bias

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dynrel-relative-load-bias
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/mini-elf-dynrel-relative.rs tests/dynamic_rel_relative.rs
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:conquest/dynrel-relative-load-bias
