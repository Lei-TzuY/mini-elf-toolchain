name: Conquest Rustfmt

on:
  push:
    branches:
      - conquest/verneed-needed-consistency

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/verneed-needed-consistency
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "LeiZ"
            git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
            git add src/bin/mini-elf-needed-check.rs tests/dynamic_needed_check.rs
            git commit -m "style: apply canonical rustfmt"
            git push
          fi
