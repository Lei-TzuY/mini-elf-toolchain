name: Conquest rustfmt

on:
  push:
    branches:
      - conquest/eh-frame-hdr-table

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - name: Write canonical source formatting
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/bin/mini-elf-eh-frame.rs; then
            exit 0
          fi
          content="$(base64 -w0 src/bin/mini-elf-eh-frame.rs)"
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/contents/src/bin/mini-elf-eh-frame.rs" \
            -f message='style: apply rustfmt to EH frame inspector' \
            -f content="$content" \
            -f sha='363843f20366a9a258ecf321c8171246fcbece45' \
            -f branch='conquest/eh-frame-hdr-table'
      - name: Write canonical test formatting
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- tests/dynamic_eh_frame.rs; then
            exit 0
          fi
          current_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/tests/dynamic_eh_frame.rs?ref=conquest/eh-frame-hdr-table" --jq .sha)"
          content="$(base64 -w0 tests/dynamic_eh_frame.rs)"
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/contents/tests/dynamic_eh_frame.rs" \
            -f message='style: apply rustfmt to EH frame tests' \
            -f content="$content" \
            -f sha="$current_sha" \
            -f branch='conquest/eh-frame-hdr-table'
