name: Conquest Rustfmt

on:
  push:
    branches:
      - conquest/eh-frame-table-entries

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/eh-frame-table-entries
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical formatting
        run: cargo fmt --all
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-eh-frame.rs tests/dynamic_eh_frame_entries.rs
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:conquest/eh-frame-table-entries
