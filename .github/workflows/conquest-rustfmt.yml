name: Conquest Rustfmt

on:
  push:
    branches:
      - conquest/eh-frame-zr-encoding

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/eh-frame-zr-encoding
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/bin/mini-elf-eh-frame-encoding.rs tests/dynamic_eh_frame_encoding.rs
            git commit -m "style: apply canonical rustfmt"
            git push
          fi
