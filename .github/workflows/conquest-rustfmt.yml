name: Conquest Rustfmt

on:
  push:
    branches:
      - conquest/dyninit-exec-hooks
    paths:
      - .github/workflows/conquest-rustfmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/dyninit-exec-hooks
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-dyninit.rs tests/dynamic_init_hook_permissions.rs
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:conquest/dyninit-exec-hooks
