name: conquest-rustfmt

on:
  push:
    branches:
      - conquest/lsda-ttype

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/lsda-ttype
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        run: |
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/mini-elf-lsda-ttype.rs tests/dynamic_lsda_ttype.rs
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:conquest/lsda-ttype
