name: Clippy diagnostic

on:
  push:
    branches:
      - conquest/lsda-header-envelope

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/lsda-header-envelope
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture clippy output
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > clippy-diagnostic.txt 2>&1
          status=$?
          echo "exit=$status" >> clippy-diagnostic.txt
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add clippy-diagnostic.txt
          git commit -m "ci: capture clippy diagnostic"
          git push origin HEAD:conquest/lsda-header-envelope
