name: Apply ABS64 GNU hash slice
on:
  push:
    branches: [feat/dynrela-abs64-gnu-hash]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source, tests, and docs
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/bin/mini-elf-dynrela-abs64.rs')
          s = p.read_text()
          glob = Path('src/bin/mini-elf-dynrela-glob-dat.rs').read_text()
          s = s.replace('const DT_HASH: i64 = 4;\n', 'const DT_HASH: i64 = 4;\nconst DT_GNU_HASH: i64 = 0x6fff_fef5;\n', 1)
          s = s.replace('    hash: u64,\n    symtab: u64,', '    hash: Option<u64>,\n    gnu_hash: Option<u64>,\n    symtab: u64,', 1)
          old = '''    let hash = map_file_backed_range(file, &headers, metadata.hash, 8, 0, "DT_HASH header")?;\n    let symbol_count = u64::from(read_u32(hash, 4));\n    if symbol_count == 0 {\n        return Err("DT_HASH reports zero dynamic symbols".to_owned());\n    }\n'''
          new = '''    let symbol_count = dynamic_symbol_count(file, &headers, metadata.hash, metadata.gnu_hash)?;\n    if symbol_count == 0 {\n        return Err("dynamic hash metadata reports zero dynamic symbols".to_owned());\n    }\n'''
          assert old in s
          s = s.replace(old, new, 1)
          helper = glob[glob.index('fn dynamic_symbol_count('):glob.index('fn dynamic_string(')]
          helper = helper.replace('R_X86_64_GLOB_DAT validation requires DT_HASH or DT_GNU_HASH to bound DT_SYMTAB', 'R_X86_64_64 validation requires DT_HASH or DT_GNU_HASH to bound DT_SYMTAB')
          s = s.replace('fn dynamic_string(', helper + 'fn dynamic_string(', 1)
          s = s.replace('    let mut hash = None;\n    let mut symtab = None;', '    let mut hash = None;\n    let mut gnu_hash = None;\n    let mut symtab = None;', 1)
          s = s.replace('            DT_HASH => set_once(&mut hash, value, "DT_HASH")?,\n            DT_SYMTAB', '            DT_HASH => set_once(&mut hash, value, "DT_HASH")?,\n            DT_GNU_HASH => set_once(&mut gnu_hash, value, "DT_GNU_HASH")?,\n            DT_SYMTAB', 1)
          s = s.replace('        hash: required(hash, "DT_HASH")?,\n        symtab:', '        hash,\n        gnu_hash,\n        symtab:', 1)
          p.write_text(s)

          src = Path('tests/dynamic_rela_glob_dat_gnu_hash.rs').read_text()
          src = src.replace('glob-dat', 'abs64').replace('glob_dat', 'abs64').replace('GLOB_DAT', '64')
          old_asm = '.text\\n.globl read_target\\n.type read_target,@function\\nread_target:\\nmov target@GOTPCREL(%rip), %rax\\nmov (%rax), %rax\\nret\\n.size read_target, .-read_target\\n.data\\n.globl target\\n.type target,@object\\n.size target,8\\ntarget:\\n.quad 0x1122334455667788\\n'
          new_asm = '.text\\n.globl dummy\\n.type dummy,@function\\ndummy:\\nret\\n.size dummy, .-dummy\\n.data\\n.globl ptr\\n.type ptr,@object\\n.size ptr,8\\nptr:\\n.quad target\\n.globl target\\n.type target,@object\\n.size target,8\\ntarget:\\n.quad 0x1122334455667788\\n'
          assert old_asm in src
          src = src.replace(old_asm, new_asm, 1)
          src = src.replace('fn accepts_gnu_hash_only_64_image()', 'fn accepts_gnu_hash_only_abs64_image()')
          Path('tests/dynamic_rela_abs64_gnu_hash.rs').write_text(src)

          d = Path('docs/mini-elf-dynrela-abs64.md')
          text = d.read_text()
          text = text.replace('`DT_RELAENT`, SysV `DT_HASH`, `DT_SYMTAB`/`DT_SYMENT`', '`DT_RELAENT`, either SysV `DT_HASH` or GNU `DT_GNU_HASH`, `DT_SYMTAB`/`DT_SYMENT`')
          text = text.replace('bounded by `DT_HASH.nchain`', 'bounded by `DT_HASH.nchain` or a checked `DT_GNU_HASH` chain walk')
          text = text.replace('GNU `ld --hash-style=sysv`', 'GNU `ld --hash-style=sysv` and `--hash-style=gnu`')
          text += '\nGNU-hash-only images are accepted with checked bucket, bloom, prefix, and chain arithmetic; malformed or unterminated file-backed chain metadata is rejected before symbol access.\n'
          d.write_text(text)
      - name: Format and test
        run: |
          cargo fmt --all -- --check || cargo fmt --all
          cargo test --test dynamic_rela_abs64 --test dynamic_rela_abs64_gnu_hash
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bin/mini-elf-dynrela-abs64.rs tests/dynamic_rela_abs64_gnu_hash.rs docs/mini-elf-dynrela-abs64.md
          git commit -m 'feat: accept GNU-hash-only ABS64 images'
          git push
