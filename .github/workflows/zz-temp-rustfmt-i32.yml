name: Temporary rustfmt i32

on:
  push:
    branches:
      - feat/dynrela-i32-gnu-hash

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynrela-i32-gnu-hash
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and remove temporary workflow
        run: |
          cargo fmt --all
          git rm .github/workflows/zz-temp-rustfmt-i32.yml
          git add src/bin/mini-elf-dynrela-i32.rs tests/dynamic_rela_i32_gnu_hash.rs docs/mini-elf-dynrela-i32.md
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:feat/dynrela-i32-gnu-hash
