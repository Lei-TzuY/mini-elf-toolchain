name: Format PC16 conquest slice

on:
  push:
    branches:
      - conquest/pc16-gnu-hash

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/pc16-gnu-hash
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git rm .github/workflows/format-pc16-conquest.yml
          if git diff --quiet --cached && git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "style: apply rustfmt to PC16 GNU-hash slice"
          git push origin HEAD:conquest/pc16-gnu-hash
