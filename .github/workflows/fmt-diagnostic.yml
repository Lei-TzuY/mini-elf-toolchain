name: fmt-diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          cargo fmt --all
          git diff -- src/bin/mini-elf-relocs.rs tests/readelf_relocs.rs > /tmp/fmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: /tmp/fmt.patch
