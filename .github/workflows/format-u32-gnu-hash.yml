name: Format u32 GNU hash slice

on:
  push:
    branches:
      - feat/dynrela-u32-gnu-hash

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynrela-u32-gnu-hash
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/mini-elf-dynrela-u32.rs tests/dynamic_rela_u32_gnu_hash.rs
          git commit -m "style: apply rustfmt to R_X86_64_32 GNU hash slice"
          git push origin HEAD:feat/dynrela-u32-gnu-hash
