name: DTPOFF32 Format Repair

on:
  push:
    branches:
      - feat/dynrela-dtpoff32

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynrela-dtpoff32
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/mini-elf-dynrela-dtpoff32.rs tests/dynamic_rela_dtpoff32.rs
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:feat/dynrela-dtpoff32
