name: Format TPOFF64 candidate
on:
  push:
    branches: [feat/dynrela-tpoff64]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynrela-tpoff64
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add src/bin/mini-elf-dynrela-tpoff64.rs tests/dynamic_rela_tpoff64.rs
          git commit -m "style: format TPOFF64 candidate"
          git push origin HEAD:feat/dynrela-tpoff64
